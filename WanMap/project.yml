# XcodeGen 用プロジェクト定義（Mac で `xcodegen generate` すると .xcodeproj が生成される）
name: WanMap
packages:
  # 施設マーカーのクラスタリング（MIT）。フェーズDで導入。バージョンはタグ固定。
  ClusterMap:
    url: https://github.com/vospennikov/ClusterMap
    from: 3.0.0
  # 位置情報の async/await ラッパー（MIT）。フェーズIで導入。現行6.x系で固定（解決先はタグ 6.0）。
  SwiftLocation:
    url: https://github.com/malcommac/SwiftLocation
    from: 6.0.0
options:
  # バンドルIDの接頭辞（フェーズLで正式ドメインに統一）。
  # 本体は settings で jp.wanmap.app を明示し、拡張は jp.wanmap.app.share を明示する。
  # テストターゲットはこの接頭辞から自動生成される（jp.wanmap.WanMapTests）。
  bundleIdPrefix: jp.wanmap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "犬友と合流するために、あなたが置いた「今ここ」の位置を表示します。位置が自動で共有されることはありません。"
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "アプリを閉じている間も「今ここ」を反映するために使います。許可した場合のみ有効です。"
targets:
  WanMap:
    type: application
    platform: iOS
    dependencies:
      - package: ClusterMap
        product: ClusterMap
      - package: ClusterMap
        product: ClusterMapSwiftUI
      - package: SwiftLocation
        product: SwiftLocation
      # 共有シート拡張（アプリに埋め込まれる。フェーズJ）
      - target: WanMapShare
    sources:
      - Sources
      # 拡張と本体で共有するコード（App Groups経由の受け渡し）
      - Shared
    resources:
      - Resources/facilities.json
      - Resources/Assets.xcassets
      # 完了フィードバックの短い合成音（デザイン・気持ちよさ第一弾）。
      # XcodeGenのファイル列挙ではバンドル直下に平置きされるため、
      # 読み込み側（FeedbackService）もサブフォルダ無しで探す
      - Resources/Sounds/completion.wav
    settings:
      base:
        # バンドルIDは正式ドメインで明示（bundleIdPrefix の自動生成 jp.wanmap.WanMap にはしない）
        PRODUCT_BUNDLE_IDENTIFIER: jp.wanmap.app
        # アプリアイコン（Resources/Assets.xcassets の AppIcon。フェーズL）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # App Groups：共有シート拡張との受け渡し場所を使うために必要（フェーズJ）
    entitlements:
      path: WanMap.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.wanmap.app
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # ホーム画面の表示名（フェーズL）
        CFBundleDisplayName: WanMap
        # 縦向き前提のアプリなので、サポート向きを Portrait のみに明示する（フェーズL）。
        # これが無いと CI で「All interface orientations must be supported unless
        # the app requires full screen.」の警告が出る。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 縦向きのみにする代わりにフルスクリーン必須を宣言する（これが無いと向きの警告が残る。CI #19で判明）
        UIRequiresFullScreen: true
        # バックグラウンド位置更新の宣言（フェーズI）。
        # 有意な位置変化でアプリが起こされ、「今ここ」を置き換えるために使う。
        # 実際に効くのは「常に許可（Always）」が取れている時だけ。
        UIBackgroundModes:
          - location

  # 共有シート取り込み（フェーズJ）
  # iOSの共有シート経由でテキスト（およびURL付きテキスト）だけを受ける拡張。
  # Instagramアプリ内の拡張ではなく、投稿の自動取得もしない（本人が共有操作した文面のみ）。
  # 拡張側は共有UserDefaultsに保留を置くだけで、解析・保存は本体側が行う。
  WanMapShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: WanMapShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.wanmap.app
    settings:
      base:
        # アプリ本体（jp.wanmap.app）の配下になるよう明示（フェーズLで統一）
        PRODUCT_BUNDLE_IDENTIFIER: jp.wanmap.app.share
    info:
      path: ShareExtension/Info.plist
      properties:
        # 共有シートに出る名前。無いとシミュレータへのインストール自体が失敗する（CI #15で判明）
        CFBundleDisplayName: WanMapに取り込む
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1

  # 単体テスト（フェーズK）
  # UIに依存しない純粋ロジック（テキスト解析・検索の正規化・「今ここ」の期限判定）を守る。
  # アプリ本体をホストとして走る（テスト側は @testable import WanMap で内部APIを使う）。
  WanMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: WanMap

  # UIテスト（画面撮影用）
  # 実機（TestFlight）前に、シミュレータ上で実際の画面を撮影して目で確認するためのもの。
  # 起動引数 -UITestingSeedData でシード予定が表示された状態で起動し、
  # 主要画面のスクリーンショットを XCTAttachment（keepAlways）として残す。
  # CIでは単体テストと別ステップで実行する（-only-testing で振り分ける）。
  WanMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: WanMap

# WanMapスキームはテスト対象を明示する（xcodebuild test が拾えるように）
schemes:
  WanMap:
    build:
      targets:
        WanMap: all
        WanMapShare: all
    test:
      targets:
        - WanMapTests
        - WanMapUITests
