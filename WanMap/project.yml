# XcodeGen 用プロジェクト定義（Mac で `xcodegen generate` すると .xcodeproj が生成される）
name: WanMap
packages:
  # 施設マーカーのクラスタリング（MIT）。フェーズDで導入。バージョンはタグ固定。
  ClusterMap:
    url: https://github.com/vospennikov/ClusterMap
    from: 3.0.0
  # 位置情報の async/await ラッパー（MIT）。フェーズIで導入。現行6.x系で固定（解決先はタグ 6.0）。
  SwiftLocation:
    url: https://github.com/malcommac/SwiftLocation
    from: 6.0.0
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "犬友と合流するために、あなたが置いた「今ここ」の位置を表示します。位置が自動で共有されることはありません。"
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "アプリを閉じている間も「今ここ」を反映するために使います。許可した場合のみ有効です。"
targets:
  WanMap:
    type: application
    platform: iOS
    dependencies:
      - package: ClusterMap
        product: ClusterMap
      - package: ClusterMap
        product: ClusterMapSwiftUI
      - package: SwiftLocation
        product: SwiftLocation
      # 共有シート拡張（アプリに埋め込まれる。フェーズJ）
      - target: WanMapShare
    sources:
      - Sources
      # 拡張と本体で共有するコード（App Groups経由の受け渡し）
      - Shared
    resources:
      - Resources/facilities.json
    # App Groups：共有シート拡張との受け渡し場所を使うために必要（フェーズJ）
    entitlements:
      path: WanMap.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.wanmap.app
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # バックグラウンド位置更新の宣言（フェーズI）。
        # 有意な位置変化でアプリが起こされ、「今ここ」を置き換えるために使う。
        # 実際に効くのは「常に許可（Always）」が取れている時だけ。
        UIBackgroundModes:
          - location

  # 共有シート取り込み（フェーズJ）
  # iOSの共有シート経由でテキスト（およびURL付きテキスト）だけを受ける拡張。
  # Instagramアプリ内の拡張ではなく、投稿の自動取得もしない（本人が共有操作した文面のみ）。
  # 拡張側は共有UserDefaultsに保留を置くだけで、解析・保存は本体側が行う。
  WanMapShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: WanMapShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.wanmap.app
    settings:
      base:
        # アプリ本体（com.example.WanMap）の配下になるよう明示
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WanMap.WanMapShare
    info:
      path: ShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
