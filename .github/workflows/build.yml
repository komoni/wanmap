# Mac が無くてもクラウド（GitHub Actions の macOS ランナー）でビルド検証できるようにする。
# 手元でテストできなくても、コンパイルエラーとユニットテストはここで潰す。
name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: WanMap
        run: xcodegen generate
      # 診断：生成された .xcodeproj の中で、resources のファイルが
      # PBXResourcesBuildPhase へ登録されているかを出す。バンドルに
      # ファイルが入らない原因が「生成プロジェクトへの未登録」なのか
      # 「ビルド時のコピー漏れ」なのかを切り分けるため。
      - name: Diagnose generated project resources
        if: always()
        working-directory: WanMap
        run: |
          set +e
          PBX=WanMap.xcodeproj/project.pbxproj
          echo "===== resource references in project.pbxproj ====="
          grep -n "facilities.json\|completion.wav\|husky-face\|Assets.xcassets" "$PBX" || true
          echo "===== PBXResourcesBuildPhase sections ====="
          sed -n '/Begin PBXResourcesBuildPhase/,/End PBXResourcesBuildPhase/p' "$PBX" || true
          true
      - name: Build (no signing)
        working-directory: WanMap
        run: |
          xcodebuild build \
            -project WanMap.xcodeproj \
            -scheme WanMap \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      # 診断：project.yml の resources に列挙したファイルが、実際に
      # アプリバンドルへ入っているかを推測でなく実物で確定させるダンプ。
      # 実装は scripts/dump-app-bundle.sh に共通化し、UIテスト後にも
      # 同じ内容を再実行する（シミュレータ向け .app はテストビルド後に
      # 生成されるため、この時点では通常 not found になる）。
      - name: Diagnose app bundle resources
        if: always()
        working-directory: WanMap
        run: bash scripts/dump-app-bundle.sh
      # テスト用のシミュレータは機種名を固定せず、利用可能な iPhone から動的に選ぶ
      # （Xcode の世代が変わって機種名が入れ替わっても壊れないようにするため）
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m 1 'iPhone' | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          test -n "$UDID"
          echo "Simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # ビルド（実機向け汎用）とテスト（シミュレータ）はステップを分け、
      # 失敗した時にどちらで落ちたか分かるようにする。
      # スキームには UI テストも登録されているため、単体テストは -only-testing で限定する
      - name: Test (unit tests on simulator)
        working-directory: WanMap
        run: |
          xcodebuild test \
            -project WanMap.xcodeproj \
            -scheme WanMap \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -only-testing:WanMapTests \
            CODE_SIGNING_ALLOWED=NO
      # UIテスト（画面撮影）：実機前にシミュレータの実画面を目で確認するためのもの。
      # UIテストは不安定になりやすいので、失敗してもビルド／単体テストの成否と
      # 混ざらないよう別ステップ＋continue-on-error にする（ステップ自体は赤く表示され、
      # 失敗したことは分かる）。スクリーンショットは成否によらずアーティファクトに残す。
      # if: always()：単体テストが失敗してもこのステップをスキップせず、撮影だけは
      # 必ず残す（CI #51 で単体テスト失敗→UIテスト未実行→スクショ皆無になった反省）。
      - name: UI tests (screenshots)
        if: always()
        continue-on-error: true
        working-directory: WanMap
        run: |
          # 地図がドッグウィズ周辺で開けるよう、シミュレータの現在地を best effort で寄せる
          # （失敗しても撮影自体は続行する。位置が無ければ日本全体表示で撮れる）
          xcrun simctl boot '${{ steps.sim.outputs.udid }}' || true
          xcrun simctl location '${{ steps.sim.outputs.udid }}' set 35.1649375,137.08455 || true
          xcodebuild test \
            -project WanMap.xcodeproj \
            -scheme WanMap \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -only-testing:WanMapUITests \
            -resultBundlePath build/UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      # 診断（再掲）：UIテスト後ならシミュレータ向け .app が生成済みなので、
      # テストが実際に使ったバンドルの中身をここで確定させる。
      - name: Diagnose app bundle resources (post-test)
        if: always()
        continue-on-error: true
        working-directory: WanMap
        run: bash scripts/dump-app-bundle.sh
      # XCTAttachment で残したスクリーンショットを .xcresult から画像として取り出す
      - name: Extract screenshots from UI test result
        if: always()
        continue-on-error: true
        working-directory: WanMap
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments \
            --path build/UITestResults.xcresult \
            --output-path build/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanmap-screenshots
          path: WanMap/build/screenshots
          if-no-files-found: warn
      # UIテスト中にアプリが終了した場合の切り分け用に、結果バンドル本体も残す
      # （.xcresult 内の Diagnostics にクラッシュレポート .ips が格納されるため。
      # 添付抽出だけでは診断情報が残らない）。バンドルはスクリーンショットや
      # 画面録画を含むため数十〜数百MBになり得るので、保持期間は短めにする。
      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanmap-xcresult
          path: WanMap/build/UITestResults.xcresult
          if-no-files-found: warn
          retention-days: 14
